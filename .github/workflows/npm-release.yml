name: npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version; dispatch this workflow from refs/tags/v<version>
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish aker-build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6

      # No `registry-url`, deliberately. It writes an .npmrc carrying
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and defaults NODE_AUTH_TOKEN to the
      # placeholder `XXXXX-XXXXX-XXXXX-XXXXX` when no token is given, so npm authenticates with
      # that placeholder instead of exchanging its OIDC identity and Trusted Publishing is never
      # attempted. The registry is already pinned by `publishConfig.registry` in the generated
      # manifest, which validateReleaseManifest requires, so nothing is lost by omitting it.
      # Guarded by scripts/release-oidc-auth.mjs.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          package-manager-cache: false

      - run: corepack enable
      - run: npm install --global npm@11.5.1
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check:namespace
      - run: corepack pnpm test
      - run: corepack pnpm typecheck
      - run: corepack pnpm dlx tsx packages/eval/src/bin.ts
      - run: corepack pnpm build:cli-package
      - run: node scripts/release-preflight.mjs "$RELEASE_VERSION"
      - run: node scripts/verify-cli-package.mjs --tarball-dir release
      # The `./` is load-bearing: npm parses a bare `release/…` argument as a GitHub
      # shorthand and tries to clone it, failing with a git authentication error at the
      # last step of the release. See scripts/release-publish-path.mjs.
      - run: npm publish "./release/aker-build-${RELEASE_VERSION}.tgz" --provenance
